<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin collection</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="layout">
    <section class="panel" aria-labelledby="form-heading">
      <p class="eyebrow">Coin collection</p>
      <h1 id="form-heading">Add a coin</h1>
      <p>Add a coin and its specifications to the shared collection.</p>
      <form id="coin-form" novalidate>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" required maxlength="120" aria-describedby="name-error">
          <span class="error" id="name-error"></span>
        </div>
        <div class="field">
          <label for="circulation-or-bullion">Circulation or bullion</label>
          <select id="circulation-or-bullion" name="circulation_or_bullion" required aria-describedby="circulation-or-bullion-error">
            <option value="">Select a type</option>
            <option value="circulation">Circulation</option>
            <option value="bullion">Bullion</option>
          </select>
          <span class="error" id="circulation-or-bullion-error"></span>
        </div>
        <div class="years">
          <div class="field">
            <label for="Ag">Silver content (Ag)</label>
            <input id="Ag" name="Ag" type="number" required min="0" max="1" step="any" placeholder="0.9" aria-describedby="Ag-error">
            <span class="error" id="Ag-error"></span>
          </div>
          <div class="field">
            <label for="weight-g">Weight (g)</label>
            <input id="weight-g" name="weight_g" type="number" required min="0" step="any" placeholder="26.73" aria-describedby="weight-g-error">
            <span class="error" id="weight-g-error"></span>
          </div>
          <div class="field">
            <label for="weight-toz">Weight (troy oz)</label>
            <input id="weight-toz" name="weight_toz" type="number" required min="0" step="any" placeholder="0.85944" aria-describedby="weight-toz-error">
            <span class="error" id="weight-toz-error"></span>
          </div>
          <div class="field">
            <label for="asw-toz">ASW (troy oz)</label>
            <input id="asw-toz" name="ASW_toz" type="number" required min="0" step="any" placeholder="0.77344" aria-describedby="asw-toz-error">
            <span class="error" id="asw-toz-error"></span>
          </div>
          <div class="field">
            <label for="number">Number</label>
            <input id="number" name="number" type="number" required min="0" step="1" placeholder="2" aria-describedby="number-error">
            <span class="error" id="number-error"></span>
          </div>
          <div class="field">
            <label for="production-run">Production run</label>
            <input id="production-run" name="production_run" type="text" required maxlength="120" placeholder="1878-1904, 1921" aria-describedby="production-run-error">
            <span class="error" id="production-run-error"></span>
          </div>
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required maxlength="2000" aria-describedby="description-error"></textarea>
          <span class="error" id="description-error"></span>
        </div>
        <button type="submit">Add coin</button>
        <p id="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="collection" aria-labelledby="coins-heading">
      <header class="collection-header">
        <p class="eyebrow">Shared collection</p>
        <h2 id="coins-heading">Coins</h2>
        <p>Coin details and specifications</p>
      </header>
      <div id="coin-status" role="status" aria-live="polite">Loading coins…</div>
      <div id="coin-items"></div>
      <footer class="collection-footer">Coin information from the shared collection.</footer>
    </section>
  </main>
  <template id="coin-item-template">
    <article class="coin-item">
      <div class="experience-heading"><h3 class="coin-name"></h3><p class="coin-type"></p></div>
      <p class="coin-specs"></p>
      <p class="coin-run"></p>
      <p class="coin-description"></p>
    </article>
  </template>
</body>
</html>
